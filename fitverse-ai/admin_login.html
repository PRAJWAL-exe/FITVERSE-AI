<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Login</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Azonix&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .admin-logo {
            font-family: 'Azonix', sans-serif;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .admin-logo span {
            color: var(--primary);
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .login-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 10px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
            outline: none;
        }

        .login-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(253, 185, 21, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Azonix', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(253, 185, 21, 0.3);
        }

        .error-msg {
            color: var(--secondary);
            font-size: 0.8rem;
            margin-top: 15px;
            min-height: 20px;
            opacity: 0;
            transition: 0.3s;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="login-card animate-fade">
        <div class="admin-logo">FITVERSE<span>.AI</span></div>
        <div class="subtitle">Secure Admin Gateway</div>

        <form id="login-form">
            <div class="input-group">
                <label>Access ID</label>
                <input type="text" id="username" class="login-input" placeholder="Enter Admin ID" required>
            </div>

            <div class="input-group">
                <label>Passkey</label>
                <input type="password" id="password" class="login-input" placeholder="Enter Secure Key" required>
            </div>

            <button type="submit" class="login-btn">AUTHENTICATE</button>
            <div class="error-msg" id="login-msg">Invalid Credentials</div>
        </form>

        <a href="index.html" class="back-link">← Return to Main Site</a>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Inline init for Login Page
        document.addEventListener('DOMContentLoaded', () => {
            initAdminLogin();
        });
    </script>
</body>

</html>
