<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITVERSE AI | Command Center</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Azonix&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="admin-layout" id="adminLayout">
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-logo">FITVERSE<span>.AI</span></div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="#" class="sidebar-link active" data-view="members">
                        <span class="sidebar-icon">👥</span> <span>Members</span>
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <a href="index.html" class="logout-btn"
                    style="background: var(--primary); color: #000; margin-bottom: 10px; text-align: center; font-weight: bold;">Return
                    to Website</a>
                <a href="index.html" class="logout-btn"
                    style="opacity: 0.5; font-size: 0.8rem; text-align: center; margin-bottom: 15px;">Logout</a>

                <!-- Wipe Data Button -->
                <button id="wipe-data-btn" class="logout-btn"
                    style="background: rgba(255, 7, 58, 0.1); color: #ff073a; border: 1px solid rgba(255, 7, 58, 0.4); text-align: center; font-weight: 600; border-radius: 30px; cursor: pointer; transition: 0.3s; width: 100%; padding: 10px; font-size: 0.85rem; letter-spacing: 1px;">
                    ☢ WIPE SYSTEM DATA
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="admin-main">
            <!-- Top Bar -->
            <header class="admin-topbar">
                <div class="admin-menu-toggle" id="adminMenuToggle">☰</div>
                <h2 class="admin-page-title" style="margin-right: 20px; font-size: 1.5rem; margin-bottom: 0;">Command
                    Center</h2>
                <div class="admin-topbar-actions" style="flex: 1; max-width: 400px;">
                    <div class="search-box" style="position: relative; width: 100%;">
                        <span
                            style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888;">🔍</span>
                        <input type="text" id="adminSearch" placeholder="Search operatives or transactions..."
                            style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 15px 10px 45px; border-radius: 30px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s;">
                    </div>
                </div>
                <div class="admin-user-profile">
                    <div class="profile-menu">
                        <span>Admin</span>
                        <div class="admin-avatar">A</div>
                    </div>
                </div>
            </header>

            <!-- Main Viewport -->
            <div class="main-viewport">

                <!-- VIEW: MEMBERS -->
                <div id="view-members" class="admin-view-section active">
                    <!-- Section 1: Members List -->
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3>Operative Database</h3>
                        <div style="display: flex; gap: 10px;">
                            <button id="export-txt-btn" class="btn btn-sm"
                                style="background: #333; border: 1px solid #555;" onclick="exportForNotepad()">Export to
                                Notepad</button>
                        </div>
                    </div>
                    <div class="saas-table-container" style="margin-bottom: 50px;">
                        <table class="saas-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Metrics</th>
                                    <th>Subscription</th>
                                    <th>Primary Directive</th>
                                    <th>Join Date</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="members-table-body">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Section 2: Membership Transactions -->
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px;">
                        <h3>Membership Transactions</h3>
                    </div>
                    <div class="saas-table-container">
                        <table class="saas-table">
                            <thead>
                                <tr>
                                    <th>Member</th>
                                    <th>Plan</th>
                                    <th>Amount</th>
                                    <th>Method</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="payments-table-body">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Initialization Logic -->
    <script src="js/app.js"></script>
</body>

</html>
