<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITVERSE AI | Join Now</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar" id="main-navbar"></header>

    <div class="container" style="padding-top: 50px;">
        <div style="text-align: center;">
            <h1 class="animate-fade">Join The <span style="color:var(--secondary)">Revolution</span></h1>
            <p class="animate-fade delay-1">Start your transformation today.</p>
        </div>

        <div class="form-container animate-fade delay-2">
            <form id="join-form">
                <div class="form-group">
                    <label for="join-name">Full Name</label>
                    <input type="text" id="join-name" class="form-control" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="join-height">Height (cm)</label>
                    <input type="number" id="join-height" class="form-control" placeholder="e.g. 175">
                </div>
                <div class="form-group">
                    <label for="join-weight">Weight (kg)</label>
                    <input type="number" id="join-weight" class="form-control" placeholder="e.g. 70">
                </div>
                <div class="form-group">
                    <label for="join-goal">Fitness Goal</label>
                    <div class="custom-select" style="position: relative;">
                        <select id="join-goal" class="form-control" style="background: rgba(0,0,0,0.3); color: #fff;">
                            <option value="Weight Loss">Weight Loss</option>
                            <option value="Muscle Gain">Muscle Gain</option>
                            <option value="Endurance">Endurance</option>
                            <option value="Flexibility">Flexibility</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Register Member</button>
            </form>

            <div id="form-message" class="result-box"></div>
        </div>
    </div>

    <footer id="main-footer"></footer>

    <script src="js/app.js"></script>
</body>

</html>
